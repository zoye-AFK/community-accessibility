<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>社区设施可及性分析 - 精确地址版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        
        .content { padding: 30px; }
        
        .search-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        
        .mode-tab {
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
        }
        
        .mode-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .mode-panel {
            display: none;
        }
        
        .mode-panel.active {
            display: block;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .input-group button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .address-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .community-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .community-tag {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .community-tag:hover {
            background: #667eea;
            color: white;
        }
        
        .legend {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 13px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            display: inline-block;
            margin-right: 8px;
        }
        .legend-color.straight { background: #17a2b8; }
        .legend-color.driving { background: #28a745; }
        .legend-color.transit { background: #fd7e14; }
        
        .results { display: none; }
        
        .overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .overview-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .overview-card .number { font-size: 32px; font-weight: bold; }
        .overview-card .label { font-size: 13px; opacity: 0.9; margin-top: 8px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid;
            cursor: pointer;
        }
        
        .stat-card .icon { font-size: 28px; }
        .stat-card .count { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card .type { font-size: 13px; color: #666; }
        
        .facility-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .facility-section h3 {
            margin-bottom: 15px;
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }
        
        .facility-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .facility-table th, .facility-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .facility-table th { background: #e9ecef; }
        .distance-driving { color: #28a745; font-weight: bold; }
        
        .loading {
            text-align: center;
            padding: 50px;
            display: none;
        }
        
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .current-location {
            margin-top: 15px;
            padding: 10px;
            background: #e8f4fd;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏘️ 社区公共服务设施可及性分析系统</h1>
            <p>8大类标准：教育 | 医疗卫生 | 文化体育 | 商业服务 | 金融邮电 | 社区服务 | 市政公用 | 行政管理</p>
        </div>
        
        <div class="content">
            <div class="search-section">
                <div class="mode-tabs">
                    <div class="mode-tab active" onclick="switchMode('preset')">📌 快捷选择社区</div>
                    <div class="mode-tab" onclick="switchMode('address')">📍 输入精确地址</div>
                </div>
                
                <!-- 模式1：预设社区 -->
                <div id="presetMode" class="mode-panel active">
                    <div class="input-group">
                        <label>选择社区</label>
                        <input type="text" id="communityInput" placeholder="输入社区名称" list="communityList">
                        <datalist id="communityList"></datalist>
                    </div>
                    <div class="community-tags" id="communityTags"></div>
                </div>
                
                <!-- 模式2：精确地址 -->
                <div id="addressMode" class="mode-panel">
                    <div class="input-group">
                        <label>输入精确地址（越详细越准确）</label>
                        <input type="text" id="exactAddress" placeholder="例如：广东省佛山市禅城区祖庙路21号">
                        <div class="address-hint">💡 提示：输入详细的门牌号或建筑物名称，距离会更准确</div>
                    </div>
                    <div class="input-group">
                        <button onclick="geocodeAndSearch()">🔍 定位并分析</button>
                    </div>
                    <div id="currentLocationInfo" class="current-location"></div>
                </div>
                
                <div class="input-group" style="margin-top: 15px;">
                    <label>📏 搜索半径</label>
                    <select id="searchRadius">
                        <option value="3">3公里范围内</option>
                        <option value="5" selected>5公里范围内</option>
                        <option value="10">10公里范围内</option>
                    </select>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="includeTransit">
                    <label>🚌 同时计算公交+步行距离（会稍慢）</label>
                </div>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div>⏳ 正在调用高德API获取真实距离...</div>
            </div>
            
            <div id="results" class="results">
                <div class="legend">
                    <div><span class="legend-color straight"></span> 直线距离</div>
                    <div><span class="legend-color driving"></span> 驾车最优路线（最短道路距离）</div>
                    <div id="transitLegend" style="display:none;"><span class="legend-color transit"></span> 公交+步行最优路线</div>
                </div>
                <div class="overview" id="overview"></div>
                <div class="stats-grid" id="statsGrid"></div>
                <div id="categoryDetails"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentMode = 'preset';
        let currentCustomCoords = null;
        
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.mode-panel').forEach(panel => panel.classList.remove('active'));
            
            if (mode === 'preset') {
                document.querySelector('.mode-tab:first-child').classList.add('active');
                document.getElementById('presetMode').classList.add('active');
            } else {
                document.querySelector('.mode-tab:last-child').classList.add('active');
                document.getElementById('addressMode').classList.add('active');
            }
        }
        
        async function loadCommunities() {
            const res = await fetch('/api/communities');
            const data = await res.json();
            
            const datalist = document.getElementById('communityList');
            datalist.innerHTML = '';
            data.communities.forEach(c => {
                const option = document.createElement('option');
                option.value = c.name;
                datalist.appendChild(option);
            });
            
            const tagsDiv = document.getElementById('communityTags');
            tagsDiv.innerHTML = '';
            data.communities.forEach(c => {
                const tag = document.createElement('span');
                tag.className = 'community-tag';
                tag.textContent = c.name.split('社区')[0];
                tag.onclick = () => {
                    document.getElementById('communityInput').value = c.name;
                    analyze();
                };
                tagsDiv.appendChild(tag);
            });
        }
        
        async function geocodeAndSearch() {
            const address = document.getElementById('exactAddress').value;
            if (!address) {
                alert('请输入详细地址');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const res = await fetch('/api/geocode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: address })
                });
                const data = await res.json();
                
                if (data.error) {
                    alert('定位失败：' + data.error);
                    return;
                }
                
                currentCustomCoords = { lat: data.lat, lon: data.lon, address: address };
                document.getElementById('currentLocationInfo').innerHTML = `📍 已定位到：${address}<br>坐标：${data.lat.toFixed(6)}, ${data.lon.toFixed(6)}`;
                document.getElementById('currentLocationInfo').style.display = 'block';
                
                // 继续分析
                await analyzeWithCustomCoords();
                
            } catch (error) {
                alert('请求失败：' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        async function analyze() {
            const communityName = document.getElementById('communityInput').value;
            if (!communityName) {
                alert('请选择社区');
                return;
            }
            await performAnalysis({ community_name: communityName });
        }
        
        async function analyzeWithCustomCoords() {
            if (!currentCustomCoords) return;
            await performAnalysis({
                custom_lat: currentCustomCoords.lat,
                custom_lon: currentCustomCoords.lon,
                custom_address: currentCustomCoords.address
            });
        }
        
        async function performAnalysis(params) {
            const searchRadius = parseFloat(document.getElementById('searchRadius').value);
            const includeTransit = document.getElementById('includeTransit').checked;
            
            params.search_radius = searchRadius;
            params.include_transit = includeTransit;
            
            const transitLegend = document.getElementById('transitLegend');
            transitLegend.style.display = includeTransit ? 'inline-block' : 'none';
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            
            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                const data = await res.json();
                
                if (data.error) {
                    alert('错误：' + data.error);
                    return;
                }
                
                displayResults(data.result, includeTransit);
                
            } catch (error) {
                alert('请求失败：' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').style.display = 'block';
            }
        }
        
        function displayResults(r, includeTransit) {
            const overviewHtml = `
                <div class="overview-card"><div class="number">${r.origin.name}</div><div class="label">起点</div></div>
                <div class="overview-card"><div class="number">${r.total_facilities}</div><div class="label">设施总数</div></div>
                <div class="overview-card"><div class="number">${r.statistics.avg_driving_distance}km</div><div class="label">平均驾车距离</div></div>
                <div class="overview-card"><div class="number">${r.statistics.accessibility}</div><div class="label">可及性指数</div></div>
            `;
            document.getElementById('overview').innerHTML = overviewHtml;
            
            let statsHtml = '';
            const colors = ['#28a745', '#dc3545', '#fd7e14', '#ffc107', '#6f42c1', '#20c997', '#17a2b8', '#6c757d'];
            let idx = 0;
            for (const [catId, cat] of Object.entries(r.facilities_by_category)) {
                statsHtml += `
                    <div class="stat-card" style="border-left-color: ${colors[idx % colors.length]}" onclick="scrollToCategory('${catId}')">
                        <div class="icon">${cat.icon}</div>
                        <div class="count">${cat.count}</div>
                        <div class="type">${cat.name}</div>
                    </div>
                `;
                idx++;
            }
            document.getElementById('statsGrid').innerHTML = statsHtml;
            
            let detailsHtml = '';
            for (const [catId, cat] of Object.entries(r.facilities_by_category)) {
                if (cat.items.length > 0) {
                    let tableHeader = `<thead><tr><th>设施名称</th><th>地址</th><th>📐 直线距离</th><th>🚗 驾车距离</th>`;
                    if (includeTransit) tableHeader += `<th>🚌 公交+步行</th>`;
                    tableHeader += `</tr></thead>`;
                    
                    let tableBody = '<tbody>';
                    cat.items.forEach(item => {
                        tableBody += `<tr>
                            <td>${item.name}</td>
                            <td>${item.address || '-'}</td>
                            <td class="distance-driving">${item.straight_distance} km</td>
                            <td class="distance-driving">${item.driving_distance} km</td>`;
                        if (includeTransit) {
                            tableBody += `<td class="distance-driving">${item.transit_distance !== null ? item.transit_distance + ' km' : '-'}</td>`;
                        }
                        tableBody += `</tr>`;
                    });
                    tableBody += '</tbody>';
                    
                    detailsHtml += `
                        <div class="facility-section" id="section-${catId}">
                            <h3>${cat.icon} ${cat.name}（${cat.count}个）</h3>
                            <table class="facility-table">${tableHeader}${tableBody}</table>
                        </div>
                    `;
                }
            }
            document.getElementById('categoryDetails').innerHTML = detailsHtml;
        }
        
        function scrollToCategory(categoryId) {
            const el = document.getElementById(`section-${categoryId}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        loadCommunities();
    </script>
</body>
</html>
